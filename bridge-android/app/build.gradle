plugins {
    id 'com.android.application'
}

android {
    namespace 'com.factupos.printbridge'
    compileSdk 34

    defaultConfig {
        applicationId "com.factupos.printbridge"
        minSdk 21
        targetSdk 34
        versionCode 54
        versionName "3.9.4"

        // Fecha de compilación inyectada en BuildConfig
        buildConfigField "String", "BUILD_DATE", "\"${new Date().format('yyyy-MM-dd HH:mm')}\""
    }

    // Firma release. La keystore NO vive en el repo: se pasa por variables de entorno
    // (en CI, desde secrets de GitHub). Si no estan definidas, el build sigue
    // funcionando como hasta ahora y queda firmado con la clave debug.
    //
    // POR QUE IMPORTA: Android exige que una actualizacion venga firmada con el MISMO
    // certificado que la instalacion previa. La clave debug se genera nueva en cada
    // runner de CI, asi que cada build sale con un certificado distinto y NINGUNA
    // actualizacion in-place es posible: hay que desinstalar y reinstalar. Con la
    // keystore real, ese problema desaparece de forma permanente.
    signingConfigs {
        release {
            def ksPath = System.getenv("ANDROID_KEYSTORE_PATH")
            if (ksPath && file(ksPath).exists()) {
                storeFile     file(ksPath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias      System.getenv("ANDROID_KEY_ALIAS")
                keyPassword   System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            def ksPath = System.getenv("ANDROID_KEYSTORE_PATH")
            if (ksPath && file(ksPath).exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        aidl true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

configurations.all {
    // Resolver conflicto kotlin-stdlib-jdk7/jdk8 vs kotlin-stdlib unificado
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'

    // NanoHTTPD - servidor HTTP embebido ligero (~50KB)
    implementation 'org.nanohttpd:nanohttpd:2.3.1'

    // usb-serial-for-android (mik3y) - drivers FTDI/CH34x/CP210x/PL2303/CDC-ACM
    implementation 'com.github.mik3y:usb-serial-for-android:3.10.0'

    // Java-WebSocket - cliente del servidor de colas (puerto 9300).
    // Java puro y liviano: OkHttp arrastraria kotlin-stdlib a un proyecto 100% Java
    // (ver el bloque configurations.all que ya excluye kotlin-stdlib-jdk7/jdk8).
    implementation 'org.java-websocket:Java-WebSocket:1.5.6'
}
