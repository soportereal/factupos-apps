name: Build FactuSuper (Windows · Linux · Android)

# FactuSuper como aplicación nativa (no web) que consume las APIs de FactuPOS — caso #3957 (25-nov-2026).
# Un solo código Flutter en multiplataforma/factusuper/. En el servidor no hay Flutter: se compila acá.
# F1: binarios de PRUEBA (Android firmado en debug, sin instalador). La distribución (Inno, .deb, firma oficial) es la F4.

on:
  push:
    branches: [ main ]
    paths:
      - 'multiplataforma/factusuper/**'
      - '.github/workflows/factusuper.yml'
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.50.1'
  APP: multiplataforma/factusuper

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Analizar y probar
        working-directory: ${{ env.APP }}
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test   # la A/B del motor se salta acá: sus casos salen del JS del servidor

  linux:
    needs: pruebas
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Dependencias de escritorio
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - name: Compilar
        working-directory: ${{ env.APP }}
        run: |
          flutter pub get
          flutter build linux --release
          tar -C build/linux/x64/release/bundle -czf FactuSuper-Linux-x64.tar.gz .
      # #3957: el paquete .deb para FactuPOS OS (repo apt de soportereal.com, Tienda FactuPOS Apps)
      - name: Paquete .deb
        working-directory: ${{ env.APP }}
        run: |
          V=$(grep -m1 '^version:' pubspec.yaml | sed -E 's/version: *([0-9.]+).*/\1/')
          bash installer/linux/build-deb.sh "$V" build/linux/x64/release/bundle installer/linux/Output
          dpkg-deb -I installer/linux/Output/*.deb | grep -E 'Package|Version|Architecture'
      - uses: actions/upload-artifact@v4
        with:
          name: factusuper-linux
          path: |
            ${{ env.APP }}/FactuSuper-Linux-x64.tar.gz
            ${{ env.APP }}/installer/linux/Output/*.deb
          if-no-files-found: error

  windows:
    needs: pruebas
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Compilar
        working-directory: ${{ env.APP }}
        run: |
          flutter pub get
          flutter build windows --release
          # #3967: Flutter necesita el runtime de Visual C++ (MSVCP140, VCRUNTIME140, VCRUNTIME140_1).
          # Un Windows limpio no lo trae → «no se encontró MSVCP140.dll». Se copian al lado del .exe
          # (despliegue local, sin admin) y si falta alguno la compilación FALLA, no sale un instalador roto.
          $rel = 'build\windows\x64\runner\Release'
          foreach ($dll in 'msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll') {
            $src = Join-Path $env:WINDIR "System32\$dll"
            if (-not (Test-Path $src)) { throw "Falta $dll en el runner" }
            Copy-Item $src $rel
          }
          foreach ($dll in 'msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll') {
            if (-not (Test-Path (Join-Path $rel $dll))) { throw "No quedó $dll junto al exe" }
          }
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath FactuSuper-Windows-x64.zip
          New-Item -ItemType Directory -Force installer\app | Out-Null
          Copy-Item -Recurse build\windows\x64\runner\Release\* installer\app\
      - name: Instalar Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Compilar el instalador
        working-directory: ${{ env.APP }}
        shell: pwsh
        run: |
          $v = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$v" installer\factusuper.iss
      - uses: actions/upload-artifact@v4
        with:
          name: factusuper-windows
          path: |
            ${{ env.APP }}/FactuSuper-Windows-x64.zip
            ${{ env.APP }}/installer/Output/FactuSuper-Setup.exe
          if-no-files-found: error

  android:
    needs: pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      # #3957: firma con la keystore FIJA de la casa (la misma de android.yml). Con la debug del runner cada versión sale con
      # otra firma y Android NO la instala encima (habría que desinstalar = perder las ventas guardadas en el equipo).
      - name: Restaurar keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS_B64" ]; then echo "Falta el secret ANDROID_KEYSTORE_B64: no se publica un APK con firma de prueba"; exit 1; fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Compilar
        working-directory: ${{ env.APP }}
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter pub get
          # Dos apps del mismo código (#3957): FactuSuper (la caja) y FactuMóvil (el vendedor en el celular).
          flutter build apk --release --flavor factusuper
          cp build/app/outputs/flutter-apk/app-factusuper-release.apk FactuSuper-Android.apk
          flutter build apk --release --flavor factumovil -t lib/main_factumovil.dart
          cp build/app/outputs/flutter-apk/app-factumovil-release.apk FactuMovil-Android.apk
      - name: Borrar keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: factusuper-android
          path: |
            ${{ env.APP }}/FactuSuper-Android.apk
            ${{ env.APP }}/FactuMovil-Android.apk
          if-no-files-found: error
